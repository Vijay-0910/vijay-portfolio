<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <script>
      // Apply persisted theme before paint to avoid flash. Defaults to light.
      try {
        var t = localStorage.getItem('portfolio-theme') || 'light';
        document.documentElement.setAttribute('data-theme', t);
      } catch (_) {}
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Vijayakumar — Full Stack Developer showcasing DevOps skills: CI/CD, Docker, Terraform, AWS. Shipping in public, one project at a time." />
    <meta name="keywords" content="Vijayakumar, Full Stack Developer, DevOps, CI/CD, Docker, Terraform, AWS, GitHub Actions, Jenkins, Portfolio" />
    <meta name="author" content="Vijayakumar" />
    <meta name="theme-color" content="#FF923E" />
    <title>Vijayakumar — Full Stack · Showcasing DevOps</title>

    <!-- Open Graph (LinkedIn, Slack, WhatsApp, Discord) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Vijayakumar — Full Stack · Showcasing DevOps" />
    <meta property="og:description" content="Full Stack Developer showcasing DevOps skills — CI/CD, Docker, Terraform, AWS. Shipping in public." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Vijayakumar — Full Stack · Showcasing DevOps" />
    <meta property="og:site_name" content="Vijayakumar — Portfolio" />
    <meta property="og:locale" content="en_US" />

    <meta name="twitter:card" content="summary_large_image" />

    <meta name="twitter:image" content="/og-image.png" />

    <!-- Robots / canonical -->
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="/" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&family=Poppins:wght@300;400;500;600;700;900&family=JetBrains+Mono:wght@400&display=swap"
      />
